<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Passable — heat-safe, step-free walking routes</title>
    <!--
      分享之貌。無此則其鏈之展但一白,而題作 "frontend" —— vite 之遺也。
      Open Graph and description: without these a shared link unfurls blank and
      the tab reads "frontend", the Vite scaffold default that was never changed.
    -->
    <meta
      name="description"
      content="Passable finds heat-safe, step-free walking routes across 38 US downtowns — modelling sun exposure, kerbs, steps and surface, and saying out loud when it doesn't know."
    />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Passable" />
    <meta
      property="og:title"
      content="Passable — heat-safe, step-free walking routes"
    />
    <meta
      property="og:description"
      content="Routing that models what Google Maps leaves out: sun exposure, kerb heights, steps and surface, across 38 US downtowns."
    />
    <!--
      圖必以全址舉之 —— 相對之路,諸取者皆不解。三站同載此文,
      故以 canonical 指其一,不然則索者見三而不知其孰為主。
      Absolute URLs are required: link scrapers do not resolve relative paths.
      The canonical matters because three hosts serve byte-identical content —
      without it, crawlers see three sites rather than one.
    -->
    <link rel="canonical" href="https://nayanvangala.github.io/nextstephacks/" />
    <meta property="og:url" content="https://nayanvangala.github.io/nextstephacks/" />
    <meta
      property="og:image"
      content="https://nayanvangala.github.io/nextstephacks/og.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Passable landing page: the words HEAT HAS A GEOMETRY. over a sidewalk network drawn in three inks — blue for shade, yellow for partial sun, orange for full sun."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      題之擇,必施於畫前 —— 不然則夜印之人先見一紙之閃。
      Applied before first paint: doing this in React would flash the paper base
      at anyone who has chosen the night pull. The key must match 題之鑰 in
      ThemeToggle.tsx. The key is versioned: the old world wrote "dark" on mount
      for every visitor who never chose it, so reading the old key would strand
      them all on a preference nobody set.
    -->
    <script>
      try {
        if (localStorage.getItem("passable:theme:v2") === "dark")
          document.documentElement.dataset.theme = "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <!--
      THESIS: A riso pull, not a dashboard. The three spot inks ARE the sun-exposure
      ramp, so style and data are one system; misregistration is a second, non-colour
      channel for doubt. Refuses the category's dark page with a glowing screenshot.
      OWN-WORLD: Warm uncoated paper #f2ede1, ink #14100c. Three inks: federal blue
      (shade), sunflower (partial), fluoro orange (full sun), multiplying at overlaps.
      Riso green marks interaction only, never data. Halftone grain on every field.
      Archivo with its width and weight axes actually driven. Cut-paper blocks, not pills.
      STORY: This measures what nobody else measures, and it shows you where it is
      guessing. The visitor opens the tool.
      FIRST VIEWPORT: Full-bleed network as a three-ink pull, grain visible. Masthead
      heavy condensed, hard to the top-left. Inferred segments print out of register.
      Bottom rail carries the press-run stamp: hour, build date, share assumed.
      FORM: Risograph Civic Print; dealt challenger 6 of the bolder re-roll, won both
      axes over the dealt leader, which was demoted on named product-truth grounds.
      Seed ccc611ad, round 1.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish
      review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
