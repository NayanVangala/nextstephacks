<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Passable — heat-safe, step-free walking routes</title>
    <!--
      分享之貌。無此則其鏈之展但一白,而題作 "frontend" —— vite 之遺也。
      Open Graph and description: without these a shared link unfurls blank and
      the tab reads "frontend", the Vite scaffold default that was never changed.
    -->
    <meta
      name="description"
      content="Passable finds heat-safe, step-free walking routes across 38 US downtowns — modelling sun exposure, kerbs, steps and surface, and saying out loud when it doesn't know."
    />
    <meta name="theme-color" content="#0a0a0b" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Passable" />
    <meta
      property="og:title"
      content="Passable — heat-safe, step-free walking routes"
    />
    <meta
      property="og:description"
      content="Routing that models what Google Maps leaves out: sun exposure, kerb heights, steps and surface, across 38 US downtowns."
    />
    <meta name="twitter:card" content="summary" />
    <!--
      題之擇,必施於畫前 —— 不然則暗題之人先見一白之閃。
      Applied before first paint: doing this in React would flash the dark base
      at anyone who has chosen light. The key must match 題之鑰 in ThemeToggle.tsx.
    -->
    <script>
      try {
        if (localStorage.getItem("passable:theme") === "light")
          document.documentElement.dataset.theme = "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
