<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Passable">
  <!--
    三墨之條,即曝之階:蔭青、午黃、曝赤。與 曝之色.ts 同其語,
    亦與其器之 icon-192/512 同其形 —— 一物不可二貌。

    此非一飾。其形即此器所量者:一路自蔭而入午而入全曝。
    前此之記為紫(#863bff)與青(#47bfff),二色皆不在此世界之三墨之中,
    乃scaffold之遺 —— 其記與其站,若二物之相拼。

    The three ink bars ARE the exposure ramp this tool measures: shade, partial
    sun, full sun, in the ramp's own order. Same mark as the app icons, because
    a tab icon and an installed-app icon that differ read as two products. The
    previous mark was scaffold purple and cyan, neither of which appears
    anywhere in the declared three-ink palette.

    其度校於十六像素之實描,非臆之:條七、隙二有半、邊三。
    條五而隙三有半者,其條至十六像素而不及二像素,遂糊;
    條八而隙二者,三條幾相接,而riso之紙不復見於其間。取其中。

    Proportions measured against a real 16px raster, not guessed: bars 7 units
    on 2.5-unit gaps. At 5/3.5 the bars fall under 2px and blur; at 8/2 they
    close up and the paper stops showing between them, which is the one thing a
    Riso mark cannot lose.

    髮之墨不入焉 —— 此度必失於小,而大者獨有之則一物二貌。
    No hairline rule: it cannot survive tab size, and carrying it only on the
    large icons would make this two marks instead of one.
  -->
  <rect width="32" height="32" rx="4" fill="#faf7ef"/>
  <rect x="3" y="3"    width="26" height="7" fill="#1a4bbd"/>
  <rect x="3" y="12.5" width="26" height="7" fill="#e0a000"/>
  <rect x="3" y="22"   width="26" height="7" fill="#e8410f"/>
</svg>
