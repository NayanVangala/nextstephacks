name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 之部署須此三權。
permissions:
  contents: read
  pages: write
  id-token: write

# 一時但一部署,後至者待之,不中道而棄。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: src/frontend
      - run: npm test
        working-directory: src/frontend
      # 站在 /<repo>/ 之下,故授之以 base;否則諸資皆四百。
      - run: npm run build
        working-directory: src/frontend
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # 闕之則 banner 不見,量不載。故未設此密者,其站一如其舊。
          # Unset means no banner and no analytics: a deploy without this
          # secret behaves exactly as the site did before analytics existed.
          VITE_GA_ID: ${{ secrets.VITE_GA_ID }}
          # 供給之憑。闕之則其站行於局部之报事之式 —— 得供給() 見其空而回 null,
          # 报事存於瀏覽器,而登入之鈕不render。此為所許之式,非其降。
          # 故此二者無需其守:空即其退路,而其退路已在碼中。
          #
          # Both may be absent: 得供給() returns null on an empty value, reports
          # fall back to browser-local storage, and the sign-in button is not
          # rendered at all. That is a supported mode, not a degraded one, so no
          # guard is needed here — the fallback already lives in the client.
          #
          # 其鑰本為公 —— RLS 御其資,而此鑰designed to ship in a browser bundle。
          # 置於 secrets 者,不欲其硬書於碼耳,非以其為密。
          # The anon/publishable key is public by design; RLS is what protects the
          # data. It lives in secrets to keep it out of the source, not because
          # exposure would matter.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # Pages 為 SPA 而無 router,然 404 亦以 index 應之,免直入子路而失
      - run: cp dist/index.html dist/404.html
        working-directory: src/frontend
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # ── Vercel。與 Pages 並列,不相待 ────────────────────────────────────
  # needs: build —— 故其驗不過則不部署。二站同出一源,而其 base 各異:
  # Pages 在 /<repo>/ 之下,故其 build 授之以 VITE_BASE;Vercel 在其根,
  # 故不授之,其常即斜線。此處不自 build,乃令 Vercel 自建之 ——
  # vercel.json 已載其令,而其建於彼,則 VITE_BASE 自從其常,二者不相犯。
  #
  # Runs alongside Pages, gated on the same test job. The two hosts need
  # different base paths: Pages builds with VITE_BASE=/<repo>/, Vercel serves at
  # the root and takes the default. Vercel builds it remotely from vercel.json
  # rather than uploading a prebuilt dist, so neither host's base can leak into
  # the other's bundle.
  vercel:
    needs: build
    runs-on: ubuntu-latest
    # 無鑰則不試 —— fork 之 PR 無其密,不當以敗告之。
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # projectId 與 orgId 非密也,乃其識耳 —— 無其鑰則不可用,
      # 故書於此而不入 secrets。所當密者一,即 VERCEL_TOKEN。
      # These two are identifiers, not credentials: useless without the token,
      # so they live in the file and only the token is a secret.
      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: team_IvVy7ZLmQdcNpMBNtaet4zBt
          VERCEL_PROJECT_ID: prj_OiWbCakf08NbDUlpCUwogxk10cIu
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is not set — skipping Vercel deploy."
            echo "Add it at Settings > Secrets and variables > Actions."
            exit 0
          fi
          # 其 stdout 為 JSON,非一址 —— 其址在 .deployment.url。
          #
          # 前此書之為「URL=$(vercel deploy …)」,以其 stdout 為其址而已。
          # 誤也:此 CLI(59.x)之 stdout 為一 JSON 之物,故所得者其末一行,
          # 即「}」。驗之於實,乃見 —— 其 alias 遂敗於「Failed to find ID or URL }」。
          #
          # stdout is a JSON object, NOT a bare URL. The previous form took the
          # whole of stdout as the URL, which yields "}" — the last line of the
          # JSON — and the alias step then fails with
          # "Failed to find ID or URL }". Verified against the real CLI.
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN" > deploy.json
          URL=$(jq -er '.deployment.url' deploy.json)
          echo "deployed: $URL"

          # 其址不合式則止 —— 以一非址者為 alias,則其產之域指於無物。
          case "$URL" in
            https://*.vercel.app) ;;
            *) echo "unexpected deploy output, not aliasing: $URL"; exit 1 ;;
          esac

          # passable-la 須自書之。
          #
          # vercel --prod 但自維其所隸之產域(nextstephacks.vercel.app 之屬);
          # passable-la 乃手立之 alias,不在其列,故 --prod 不之顧 ——
          # 前此其址滯於二日之前而其job猶報其成,正坐此。
          # 而 devpost 所投者正此址(docs/devpost-submission.md),故不可滯。
          #
          # MUST be explicit. `vercel --prod` only re-points domains assigned to
          # the project; passable-la.vercel.app is a hand-created alias outside
          # that set, so --prod silently leaves it on the previous deployment.
          # That is exactly how it went two days stale while this job still
          # reported success — and it is the URL submitted to Devpost.
          npx --yes vercel@latest alias set "$URL" passable-la.vercel.app --token="$VERCEL_TOKEN"

  # ── Cloudflare Pages。與 Pages、Vercel 並列,三站不相待 ──────────────
  # needs: build —— 與 vercel 同,其驗不過則不部署。
  #
  # 此站在其根,而 Pages 之 build 已以 VITE_BASE=/<repo>/ 烙其囊,不可共用。
  # Vercel 避之者,令其自建於彼也;wrangler 則須上傳一地之 dist,故此處
  # 自建之,而不授 VITE_BASE —— vite.config 之常即斜線。
  #
  # This job MUST build its own dist. The `build` job bakes
  # VITE_BASE=/<repo>/ into the bundle for GitHub Pages; Cloudflare serves at
  # the root, so that bundle's asset URLs would all 404 here. Vercel avoids the
  # clash by building remotely, but wrangler uploads a local directory — so we
  # rebuild with VITE_BASE unset and let vite.config's "/" default apply.
  #
  # 不再 npm test —— build 之job已閘之,再試則徒費二分。
  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    # 無鑰則不試 —— fork 之 PR 無其密,不當以敗告之。
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 二十二,不從他job之二十 —— wrangler 明拒二十:
          #   「Wrangler requires at least Node.js v22.0.0. You are using v20.20.2.」
          # 他job猶二十者,其行無礙,故不並改之 —— 所改者止於其所必需。
          # Deliberately diverges from the other jobs' Node 20: current wrangler
          # hard-refuses anything below 22. The other jobs are untouched because
          # they pass on 20 and bumping them would be an unrelated change.
          node-version: "22"
      - run: npm ci
        working-directory: src/frontend
      # VITE_BASE 不授 —— 其常為斜線,此站在根故也。
      - run: npm run build
        working-directory: src/frontend
        env:
          VITE_GA_ID: ${{ secrets.VITE_GA_ID }}
          # 供給之憑。闕之則其站行於局部之报事之式 —— 得供給() 見其空而回 null,
          # 报事存於瀏覽器,而登入之鈕不render。此為所許之式,非其降。
          # 故此二者無需其守:空即其退路,而其退路已在碼中。
          #
          # Both may be absent: 得供給() returns null on an empty value, reports
          # fall back to browser-local storage, and the sign-in button is not
          # rendered at all. That is a supported mode, not a degraded one, so no
          # guard is needed here — the fallback already lives in the client.
          #
          # 其鑰本為公 —— RLS 御其資,而此鑰designed to ship in a browser bundle。
          # 置於 secrets 者,不欲其硬書於碼耳,非以其為密。
          # The anon/publishable key is public by design; RLS is what protects the
          # data. It lives in secrets to keep it out of the source, not because
          # exposure would matter.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set — skipping Cloudflare deploy."
            echo "Add both at Settings > Secrets and variables > Actions."
            echo "Token scope: Account > Cloudflare Pages > Edit."
            exit 0
          fi
          npx --yes wrangler@latest pages deploy src/frontend/dist \
            --project-name=passable \
            --branch="${{ github.ref_name }}" \
            --commit-dirty=true
